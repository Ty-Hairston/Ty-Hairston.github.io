<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ty Hairston | IT Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── TOKENS ── */
    :root {
      --bg:       #080c10;
      --surface:  #0d1117;
      --panel:    #111820;
      --border:   #1e2d3d;
      --green:    #39ff9a;
      --green-dim:#1a7a4a;
      --amber:    #f0c040;
      --blue:     #4ea8de;
      --muted:    #4d6070;
      --text:     #c9d8e8;
      --mono:     'Share Tech Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      overflow-x: hidden;
      cursor: default;
    }

    /* ── SCANLINE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.07) 3px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── NOISE TEXTURE ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9998;
      opacity: 0.4;
    }

    /* ── GRID LINES ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(57,255,154,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,154,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2.5rem;
      background: rgba(8,12,16,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--mono);
      color: var(--green);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
    .nav-logo span { color: var(--muted); }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--green); }

    /* ── SECTIONS ── */
    section { position: relative; z-index: 1; }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10vw;
      padding-top: 80px;
    }

    .hero-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--green);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }

    .hero-name {
      font-family: var(--sans);
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }
    .hero-name .accent { color: var(--green); }

    .hero-title {
      font-family: var(--mono);
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: var(--amber);
      margin-top: 1.2rem;
